<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyTwin AI - Cá nhân hóa theo tài khoản</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header><h1>StudyTwin AI</h1><p>Đăng nhập để cá nhân hóa theo từng học sinh</p></header>
<main class="container">
  <section class="card" id="authCard">
    <h2>Tài khoản cá nhân</h2>
    <div class="row">
      <input id="username" placeholder="Tên đăng nhập" />
      <input id="password" type="password" placeholder="Mật khẩu" />
      <input id="fullName" placeholder="Họ tên" />
      <input id="studentClass" placeholder="Lớp" />
      <button id="registerBtn">Đăng ký</button>
      <button id="loginBtn">Đăng nhập</button>
    </div>
    <p id="authMsg"></p>
  </section>

  <section class="card" id="appCard" hidden>
    <div class="row">
      <div id="hello"></div>
      <label>Môn <select id="subject"></select></label>
      <div id="streakBadge">Streak: 0</div>
      <button id="checkinBtn">Điểm danh</button>
    </div>
    <div id="quiz"></div>
    <button id="analyzeBtn">Phân tích</button>
    <div id="report"></div>
    <div id="history"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
