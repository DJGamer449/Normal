services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    environment: ["OLLAMA_HOST=0.0.0.0:11434"]
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:11434/api/tags >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build: .
    ports: ["3000:3000"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - NEXT_PUBLIC_APP_NAME=StudyTwin AI
volumes:
  ollama_data:
